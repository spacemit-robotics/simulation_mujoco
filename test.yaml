module: components/simulation/mujoco

# viewer=false 时不创建 GL 窗口，可在 PR 档运行物理冒烟；渲染冒烟仍需桌面会话，
# 归 manual。

tests:
  - name: mujoco-error-path
    description: >
      test_mujoco 参数与配置错误处理：缺参、坏 yaml 路径须快速失败（非 0、不 hang），
      失败发生在加载配置阶段、早于窗口创建，故无需显示器。
    category: functional
    scopes: [pr]
    timeout_s: 60
    requires:
      commands: [test_mujoco]
    command: |
      bash tests/error_path.sh

  - name: mujoco-sim-smoke
    description: >
      渲染 + 物理冒烟：用机型配置加载模型、跑数秒物理与渲染，进程正常退出即通过。
      依赖桌面会话/显示器（x86 GLFW，K3 gl4es），故归 manual。
    category: stability
    scopes: [manual]
    timeout_s: 120
    workdir: sdk
    requires:
      commands: [test_mujoco]
    command: |
      bash components/simulation/mujoco/tests/sim_smoke.sh

  - name: mujoco-headless-smoke
    description: >
      viewer=false 物理冒烟：不依赖 DISPLAY，加载机型模型并按实时节拍运行数秒。
    category: stability
    scopes: [pr]
    timeout_s: 120
    workdir: sdk
    requires:
      commands: [test_mujoco]
    command: |
      SROBOTIS_MJ_TEST_HEADLESS=1 bash components/simulation/mujoco/tests/sim_smoke.sh
